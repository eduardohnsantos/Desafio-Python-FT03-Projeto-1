[project]
name = "projeto-pipeline-python-dados-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Eduardo Henrique",email = "eduardo.hnsantos@gmail.com"}
]
requires-python = ">=3.12.1"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "ratelimit (>=2.2.1,<3.0.0)",
    "tenacity (>=9.2.1,<10.0.0)",
    "pydantic (>=2.14.4,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "duckdb (>=2.0.1,<3.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "pyarrow (>=26.0.1,<27.0.0)",
    "sqlalchemy (>=2.1.9,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)"
]

[project.scripts]
pipeline = "src.pipeline:executar_pipeline"

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"